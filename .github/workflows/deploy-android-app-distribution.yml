name: Build and distribute Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  distribute:
    name: Build APK and upload to Firebase App Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create ignored Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          cat > lib/config.dart <<EOF
          const supabaseUrl = '$SUPABASE_URL';
          const supabaseAnonKey = '$SUPABASE_ANON_KEY';
          EOF

      - name: Create local Android configuration
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_ANDROID_APP_ID"
          test -n "$FIREBASE_TESTER_GROUPS"
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "GitHub Actions build $GITHUB_SHA"

      - name: Upload APK as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: nbro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
